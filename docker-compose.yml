name: codecraft

services:
  mysql:
    image: mysql:8.0
    container_name: codecraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3307:3306"  # 本机 MySQL 服务未停，暂用 3307 映射；停掉本机 MySQL 后可改回 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: codecraft-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build: ./codecraft-server
    image: codecraft-server:local
    container_name: codecraft-server
    restart: unless-stopped
    environment:
      MYSQL_URL: "jdbc:mysql://mysql:3306/jiangma?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}"
      REDIS_HOST: redis
      JIANGMA_CORS_ORIGINS: "http://localhost:8090,http://localhost:5173,http://127.0.0.1:8090"
      JIANGMA_JWT_SECRET: "${JIANGMA_JWT_SECRET:?请在 .env 中配置 JIANGMA_JWT_SECRET}"
      JIANGMA_ADMIN_USERNAME: "${JIANGMA_ADMIN_USERNAME:-admin}"
      JIANGMA_ADMIN_PASSWORD: "${JIANGMA_ADMIN_PASSWORD:-}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: codecraft-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./codecraft-web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
