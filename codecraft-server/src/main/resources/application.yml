server:
  port: 8080

spring:
  application:
    name: codecraft-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/jiangma?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

jiangma:
  jwt:
    # 生产环境务必通过环境变量 JIANGMA_JWT_SECRET 注入随机长密钥（>=32 字节）
    secret: ${JIANGMA_JWT_SECRET:}
    access-expiration: ${JIANGMA_JWT_ACCESS_EXPIRATION:7200000}
    refresh-expiration: ${JIANGMA_JWT_REFRESH_EXPIRATION:2592000000}
  cors:
    # 多个来源用英文逗号分隔，如 http://localhost:5173,https://codecraft.example.com
    allowed-origins: ${JIANGMA_CORS_ORIGINS:http://localhost:5173}